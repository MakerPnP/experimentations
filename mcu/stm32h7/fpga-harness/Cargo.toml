[package]
authors = ["Dominic Clifton <me@dominicclifton.name>"]
edition = "2021"
readme = "README.md"
name = "fpga-harness"
version = "0.1.0"

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "f1c6bb7df80e592b7a7edc709f546771506806d3", features = ["defmt", "stm32h735ig", "unstable-pac", "time-driver-tim12"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "f1c6bb7df80e592b7a7edc709f546771506806d3", features = ["defmt", "tick-hz-32_768", "defmt-timestamp-uptime-us"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "f1c6bb7df80e592b7a7edc709f546771506806d3", features = ["defmt", "platform-cortex-m", "executor-thread", "executor-interrupt"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["zero-init-ram", "set-sp", "set-vtor"] }

defmt = { version = "1.0.1" }
defmt-rtt = { version = "1.0.0" }

panic-probe = { version = "1.0.0", features = ["defmt", "print-defmt"] }

#critical-section = "1.2.0"

[[bin]]
name = "fpga-harness"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
